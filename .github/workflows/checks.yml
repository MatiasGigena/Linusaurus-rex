name: Code checks

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Install graphical test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth
          npx playwright install --with-deps chromium

      - name: Run browser behavior and pixel tests
        shell: bash
        run: |
          chromium_path=$(node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')
          CHROMIUM_PATH="$chromium_path" npm run test:terminal

      - name: Fetch pinned Rex test runtime
        shell: bash
        run: |
          set -euo pipefail
          rex_tools="$RUNNER_TEMP/rex-test-runtime"
          mkdir -p "$rex_tools"
          curl --fail --location --retry 3 \
            https://blob.superlogical.com/download/rex/snapshot/d018d2de8cc31281265906a4648ec9cae8d2f4c5/rex-linux-amd64.tar.gz \
            --output "$rex_tools/rex.tar.gz"
          echo "3d664c120300d726934a2939d09ccd2aa7ebd880ad85e610cda4338dafea8152  $rex_tools/rex.tar.gz" | sha256sum --check -
          tar --extract --gzip --file "$rex_tools/rex.tar.gz" --directory "$rex_tools" rex
          "$rex_tools/rex" version
          echo "$rex_tools" >> "$GITHUB_PATH"
          echo "REX_EXECUTABLE=$rex_tools/rex" >> "$GITHUB_ENV"

      - name: Run installed Rex integration regressions
        run: node scripts/test-desktop.mjs --isolated-rex rex-integration

      - name: Run production Electron authorization tests
        run: npm run test:boundary
