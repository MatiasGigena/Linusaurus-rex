name: Publish Linux release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag matching package.json, such as v0.3.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    if: github.repository == 'MatiasGigena/Linusaurus-rex'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify stable tag and package version
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tag = process.env.RELEASE_TAG;
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^v\d+\.\d+\.\d+$/.test(tag || '') || tag !== `v${version}`) {
            throw new Error('Release tag must be a stable vX.Y.Z matching package.json');
          }
          execFileSync('git', ['show-ref', '--verify', `refs/tags/${tag}`]);
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const tagged = execFileSync('git', ['rev-parse', `${tag}^{commit}`], { encoding: 'utf8' }).trim();
          if (head !== tagged) throw new Error('The checkout does not match the requested tag');
          JS

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        # Installed-Rex and graphical fixtures are opt-in and run locally.
        run: npm test

      - name: Build x86-64 AppImage and Debian package
        run: npm run package -- --x64

      - name: Produce and verify checksums
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(*.AppImage)
          packages=(*.deb)
          test "${#images[@]}" -eq 1
          test "${#packages[@]}" -eq 1
          sha256sum -- "${images[@]}" "${packages[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: MatiasGigena/Linusaurus-rex
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists. Published update assets are not overwritten.' >&2
            exit 1
          fi
          # Keep incomplete uploads out of the updater's latest-release feed.
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --generate-notes \
            --title "Linusaurus Rex ${RELEASE_TAG#v}" \
            release/*.AppImage release/*.deb release/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
